<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body>
<title>Interactive Entities Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: manual paso a paso a la izquierda, pantalla simulada del sistema a la derecha */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1c2429; --muted:#586770; --line:#d6dde1;
  --accent:#184e86; --accent-fg:#ffffff; --green:#4d8a0d; --green-soft:#e4f0d0; --amber:#a35d00; --amber-soft:#fdeccf;
  --hint:#f28c00;
  --erp-blue:#184e86; --erp-green:#83bc2a; --erp-text:#212529; --erp-side:#d1d2d4; --erp-alt:#f4f4f4; --erp-sel:#e0eeca; --erp-panel:#f8f9fa;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1b2329; --fg:#e8eef1; --muted:#9aabb5; --line:#33414a;
  --accent:#6fb0f0; --accent-fg:#0b1a28; --green:#9ccf4f; --green-soft:#26361a; --amber:#f2b45a; --amber-soft:#3a2a10; --hint:#ffa733; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1b2329; --fg:#e8eef1; --muted:#9aabb5; --line:#33414a;
  --accent:#6fb0f0; --accent-fg:#0b1a28; --green:#9ccf4f; --green-soft:#26361a; --amber:#f2b45a; --amber-soft:#3a2a10; --hint:#ffa733; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
.wrap{max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--fg);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:focus-visible,.mbtn:focus-visible,.step button:focus-visible{outline:2px solid var(--hint);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
#manual{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;
  max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:8px}
@media (max-width:900px){#manual{position:static;max-height:none}}
.intro{font-size:13px;color:var(--muted)}
.intro b{color:var(--fg);font-weight:500}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.phase{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -4px}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.step{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px}
.step .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.step.done{opacity:.72}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.step.cur .dot{border-color:var(--accent);color:var(--accent)}
.step h3{margin:0;font-size:13px;font-weight:600;line-height:1.35}
.step .body{margin-top:4px;font-size:12.5px;color:var(--muted)}
.step .body b{color:var(--fg);font-weight:500}
.step .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:1px 5px;border-radius:4px;color:var(--fg)}
.vals{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.vals td{padding:3px 6px 3px 0;vertical-align:top;border-top:1px solid var(--line)}
.vals td:first-child{color:var(--muted);white-space:nowrap}
.vals td:last-child{color:var(--fg);word-break:break-word;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer}
.mbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.final{background:var(--green-soft);border-radius:8px;padding:11px 13px;font-size:13px}
.note{background:var(--amber-soft);color:var(--fg);border-radius:8px;padding:9px 11px;font-size:12px}
.reset{align-self:flex-start;color:var(--muted);background:none;border:0;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}

/* ---------- Pantalla simulada del sistema ---------- */
.stage{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.stagebar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.stagebar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.scroller{overflow:auto;max-height:calc(100vh - 150px);min-height:560px;background:#fff}
@media (max-width:900px){.scroller{max-height:none}}
.erp{position:relative;min-width:1000px;min-height:560px;background:#fff;color:var(--erp-text);font-family:var(--f-ui);font-size:11.5px;line-height:1.35;color-scheme:light}
.erp *{color-scheme:light}
.eh{height:50px;background:var(--erp-blue);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.eh .l{display:flex;align-items:center;gap:12px}
.eh img{display:block;height:30px;width:auto}
.hb{background:none;border:0;padding:6px;cursor:pointer;display:grid;gap:4px}
.hb i{display:block;width:17px;height:2.5px;background:#fff;border-radius:2px}
.ebody{padding:6px 10px 40px}
.etitle{font-size:24px;font-weight:400;margin:10px 0 8px;color:var(--erp-text);line-height:1.2}
.etitle em{font-style:normal;color:var(--erp-green);text-transform:uppercase}
.etabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #dee2e6;margin-bottom:8px}
.etab{border:1px solid transparent;border-bottom:0;background:none;padding:8px 13px;font-size:11px;cursor:pointer;color:var(--erp-text);font-family:inherit;display:flex;align-items:center;gap:6px;border-radius:3px 3px 0 0}
.etab.on{border-color:#dee2e6;background:#fff;margin-bottom:-1px;font-weight:500}
.etab.sub{color:#6b7780}
.etab.on.sub{color:var(--erp-text)}
.etab.bold.on{font-weight:600}
.odot{width:9px;height:9px;border-radius:50%;background:#f7931e;box-shadow:0 0 0 3px #fde3c2;display:inline-block}
.btn{background:var(--erp-green);color:#fff;border:0;border-radius:3px;padding:6px 12px;font-size:11px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn.grey{background:#6c757d}
.btn[disabled]{background:#d8dee3;color:#fff;cursor:default}
.btnrow{display:flex;gap:6px;margin:8px 0 10px}
.ic{width:15px;height:15px;display:inline-block;vertical-align:middle;flex:none}
.icb{background:none;border:0;padding:3px;cursor:pointer;color:var(--erp-green);display:inline-flex;align-items:center}
.icb.dark{color:#212529}
/* tabla */
.grid{border:1px solid #dee2e6;background:#fff}
.gscroll{overflow:auto;max-height:520px}
.grid table{border-collapse:collapse;width:100%;table-layout:fixed}
.grid th{font-weight:600;text-align:left;padding:8px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;background:#fff;position:sticky;top:0;z-index:1}
.grid td{padding:5px 6px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.grid tr.fl td{padding:2px 6px 6px;background:#fff;position:sticky;top:27px;z-index:1;border-bottom:1px solid #eceff1}
.grid tbody tr:nth-child(even){background:var(--erp-alt)}
.grid tbody tr.rw{cursor:pointer}
.grid tbody tr.sel{background:var(--erp-sel)!important}
.grid tbody tr.edit{background:#d8e7c1!important}
.grid .lead{width:78px}
.grid .empty td{text-align:center;color:#6b7780;padding:46px 0}
.fw{display:flex;align-items:center;gap:3px}
.fw input,.fw select{flex:1;min-width:0}
.gf{width:100%}
input.i,select.i,textarea.i{width:100%;border:1px solid #ced4da;border-radius:3px;padding:5px 8px;font-size:11px;font-family:inherit;background:#fff;color:var(--erp-text);height:26px}
textarea.i{height:78px;resize:vertical}
input.i:disabled,select.i:disabled{background:#e9ecef;color:#8a949c}
input.i.err,select.i.err,.ms.err,.ac input.err{border-color:#dc3545}
.em{color:#dc3545;font-size:10px;margin-top:2px}
.gfoot{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#f8f9fa;border-top:1px solid #dee2e6;font-size:11px}
.pg{display:flex;align-items:center;gap:8px}
.pg b{font-weight:400;min-width:22px;text-align:center;padding:5px 4px;color:var(--erp-green);cursor:pointer;border-radius:3px;border:0;background:none;font-family:inherit;font-size:11px}
.pg b.on{background:#d9ecbf;cursor:default}
.pg .sz{width:62px;height:25px}
.pgb{border:0;background:none;color:#333;cursor:pointer;padding:3px 5px;font-size:10px}
/* formularios */
.frm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:30px}
.frm.one{grid-template-columns:minmax(0,1fr)}
.fr{display:grid;grid-template-columns:var(--lw,150px) minmax(0,1fr);gap:0 14px;align-items:start;margin-bottom:8px}
.fr>label{text-align:right;padding-top:7px;font-weight:500;font-size:10.5px}
.sep{border:0;border-top:1px solid var(--erp-green);margin:10px 0;grid-column:1/-1}
.rad{display:flex;gap:12px;align-items:center;padding-top:5px;font-size:10px}
.rad label{display:flex;align-items:center;gap:4px;cursor:pointer}
.rad input{accent-color:var(--erp-green);margin:0}
.ph{display:flex}
.ph span{background:#e9ecef;border:1px solid #ced4da;border-right:0;padding:5px 10px;font-size:10.5px;color:#6b7780;border-radius:3px 0 0 3px;display:grid;place-items:center;min-width:50px}
.ph input{border-radius:0 3px 3px 0}
/* multiselect y autocompletar */
.ms{position:relative;border:1px solid #ced4da;border-radius:3px;min-height:26px;padding:2px 28px 2px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer;background:#fff;font-size:11px}
.chip{background:#e9ecef;border-radius:3px;padding:2px 6px;display:inline-flex;align-items:center;gap:5px;font-size:10.5px}
.chip button{border:0;background:#333;color:#fff;width:11px;height:11px;border-radius:50%;font-size:8px;line-height:1;padding:0;cursor:pointer}
.msx{position:absolute;right:8px;top:5px;color:#888;font-size:12px;border:0;background:none;cursor:pointer}
.mslist,.aclist{position:absolute;left:-1px;right:-1px;top:100%;background:#fff;border:1px solid #ced4da;box-shadow:0 4px 10px rgba(0,0,0,.12);z-index:30;max-height:190px;overflow:auto}
.mslist div,.aclist div{padding:5px 9px;font-size:10.5px;cursor:pointer;display:flex;gap:7px;align-items:center}
.mslist div:hover,.aclist div:hover{background:var(--erp-green);color:#fff}
.mslist input{accent-color:var(--erp-green)}
.ac{position:relative}
.aclist div.none{cursor:default;color:#6b7780}
.aclist div.none:hover{background:#fff;color:#6b7780}
/* panel lateral de secciones */
.split{display:grid;grid-template-columns:116px minmax(0,1fr);gap:8px;align-items:start}
.snav{border:1px solid #dee2e6;background:var(--erp-panel);padding:8px 6px;min-height:520px;border-radius:3px}
.snav button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:6px 6px;font-size:10.5px;cursor:pointer;color:#0b5a99;font-family:inherit;text-align:left}
.snav button.on{color:var(--erp-green);font-weight:600}
.snav button.on span.t{border-bottom:2px solid var(--erp-green)}
.ck{width:12px;height:12px;border-radius:50%;border:1px solid #adb5bd;display:grid;place-items:center;flex:none;color:#fff;font-size:8px}
.ck.ok{border-color:var(--erp-green);color:var(--erp-green)}
.spanel{border:1px solid #dee2e6;background:var(--erp-panel);padding:10px 12px;min-height:520px;border-radius:3px}
.spanel .btnrow{margin-top:0}
.fpanel{border:1px solid var(--erp-green);background:#f6f9f8;padding:16px 14px;display:flex;align-items:center;gap:14px;margin:10px 0 10px;border-radius:2px}
.fpanel .f{display:flex;align-items:center;gap:12px;flex:1;font-size:10.5px;font-weight:500}
.fpanel .f>div{flex:1;max-width:330px}
/* menu lateral */
.drawer{position:absolute;left:0;top:50px;bottom:0;width:290px;background:var(--erp-side);z-index:40;overflow:auto;padding:8px 0;font-size:14px;box-shadow:4px 0 14px rgba(0,0,0,.18)}
.drawer button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;font-family:inherit;font-size:14px;padding:7px 14px;color:#2b3036;cursor:pointer}
.drawer button.l2{padding-left:44px;font-size:14px}
.drawer button.l3{padding-left:68px;font-size:13.5px}
.drawer button:hover{background:rgba(0,0,0,.07)}
.tri{font-size:8px;width:10px;display:inline-block}
.scrim{position:absolute;inset:50px 0 0 0;z-index:35;background:rgba(0,0,0,.14)}
.ovl{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:90px}
.dlg{background:#fff;width:min(620px,92%);border-radius:4px;padding:14px 12px 12px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.dlg h4{margin:0 0 14px;font-size:14.5px;font-weight:500;display:flex;justify-content:space-between}
.dlg h4 button{border:0;background:none;font-size:18px;cursor:pointer;color:#555;line-height:1}
.dlg .opts{display:flex;gap:30px;margin:6px 0 10px;font-size:10.5px}
.dlg .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.dlg .opts input{accent-color:var(--erp-green)}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.toast{position:absolute;top:56px;right:10px;z-index:80;background:var(--erp-green);color:#fff;padding:14px 22px;font-size:11px;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.code{display:inline-flex;flex-direction:column;align-items:center;background:#e9ecef;border-radius:3px;padding:2px 6px;margin:2px 3px 2px 0;font-size:10.5px;font-weight:500;line-height:1.15}
.code small{font-size:7.5px;color:#6b7780;letter-spacing:.02em;font-weight:400}
.hint{outline:2px solid var(--hint)!important;outline-offset:2px;animation:pulse 1.4s ease-in-out infinite;position:relative}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
.sub2{font-size:15px;font-weight:400;margin:6px 0 8px}
.txt{font-size:10.5px;line-height:1.6;margin:0 0 6px}
.dz{border:1px solid #dee2e6;background:#f8f9fa;display:flex;justify-content:space-between;align-items:center;padding:8px 8px;font-size:10px;color:#6b7780;max-width:920px;margin:8px 0}
.dz span{background:#e0e3e6;border-radius:3px;padding:5px 10px;color:#555}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.tb{display:flex;gap:16px;border:1px solid #dee2e6;padding:7px 14px;font-size:10px;align-items:center}
.tb span{display:inline-flex;align-items:center;gap:5px}
.foot2{text-align:center;color:#555;font-size:10px;padding:40px 0 4px}

/* ---------- Recepción / Programación / Días de servicio ---------- */
.rbtns{display:flex;gap:8px;margin:2px 0 8px}
.pill{border:1px solid var(--erp-green);background:#fff;color:#222;border-radius:14px;padding:5px 16px;font-size:11px;font-family:inherit;cursor:pointer}
.pill.on{background:var(--erp-green);color:#fff;font-weight:600}
.gpanel{border:1px solid var(--erp-green);background:#fff;padding:12px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px 18px;align-items:center;margin:4px 0 10px;border-radius:2px}
.gpanel .g{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center;font-size:10.5px;font-weight:500}
.gpanel .g label{text-align:right}
.gpanel .ico{display:flex;gap:10px;align-items:center;justify-content:flex-end;grid-row:1/3;grid-column:5}
.stp{display:flex;margin:6px 0 10px;position:relative;padding-top:6px}
.stp:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#e5e8ea}
.stp .sg{flex:1;max-width:300px;text-align:center;padding:5px 10px;font-size:10.5px;background:#eceff0;color:#333;border:0;font-family:inherit;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-left:-6px}
.stp .sg:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.stp .sg.on{background:var(--erp-green);color:#fff;font-weight:600}
.rtool{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border:1px solid #dee2e6;border-bottom:0;color:var(--erp-green)}
.rtool span{display:inline-flex;gap:12px;align-items:center}
.rtool .ic{width:17px;height:17px}
.est{display:inline-block;min-width:78px;text-align:center;padding:4px 6px;font-size:9px;font-weight:600;letter-spacing:.02em;border-radius:1px}
.sg0{background:#eceff0;color:#222}.sgr{background:#ff7b7b;color:#fff}.sgg{background:#b4bbc0;color:#fff}.sgb{background:#8ea9e3;color:#fff}.sgo{background:#f6b08a;color:#fff}.sga{background:#ffc400;color:#fff}.sgp{background:#8c9bb8;color:#fff}.sgv{background:#6cc04a;color:#fff}
.ri{display:inline-flex;align-items:center;gap:3px}
.ri .ic{width:14px;height:14px}
.ri .slot{width:15px;display:inline-flex;justify-content:center}
.icb.red{color:#e11}
.dotg{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;background:#7ab800}.doty{background:#e6c100}
.num{text-align:center}
.vmenu{position:fixed;z-index:50;background:#fff;border:1px solid #cfd4d8;box-shadow:0 4px 12px rgba(0,0,0,.18);min-width:130px}
.vmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;font-size:10px;font-family:inherit;cursor:pointer}
.vmenu button:hover{background:var(--erp-green);color:#fff}
.lnk{color:#0b5a99;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.lnk:hover{text-decoration:underline}
.dsplit{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
.dtool{display:flex;gap:6px;padding:5px 8px;border:1px solid #dee2e6;border-bottom:0}
.icb.off{color:#c3c8cc;cursor:default}
.dgrid th.day{text-align:center;font-size:9.5px;line-height:1.2;white-space:normal;padding:6px 2px 3px}
.dgrid td.day{text-align:center;padding:4px 0}
.dc{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #bdc3c7;background:#fff;vertical-align:middle}
.dc.on{border:0;background:#7ab800;position:relative}
.dc.on:after{content:"";position:absolute;left:3.5px;top:2px;width:3px;height:6px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.wk{border:0;background:none;color:var(--erp-green);font-size:14px;cursor:pointer;padding:0 3px;line-height:1}
.dpanel{border:1px solid #dee2e6;padding:12px 14px;background:#fff;min-height:420px}
.dpanel h3{font-size:11.5px;font-weight:600;margin:0 0 10px}
.dpanel h4{font-size:11.5px;font-weight:600;margin:12px 0 8px}
.dcirc{width:22px;height:22px;border-radius:50%;border:0;background:#d5d8db;color:#fff;font-size:9px;font-weight:600;cursor:pointer;font-family:inherit}
.dcirc.on{background:var(--erp-green)}
.dcirc:disabled{cursor:default;opacity:.7}
.dcircs{display:flex;gap:8px;padding:2px 0 4px}
.dt{position:relative}
.dt .dpick{position:absolute;right:0;top:0;width:34px;height:100%;opacity:0;cursor:pointer}
.dt .calb{position:absolute;right:0;top:0;width:34px;height:100%;display:grid;place-items:center;background:#f1f3f5;border:1px solid #ced4da;border-radius:0 3px 3px 0;color:#444;pointer-events:none}
.mdd{position:relative;display:inline-block}
.mdd>button{border:1px solid #ced4da;background:#fff;border-radius:3px;height:26px;width:52px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#333}
.mdd .ml{position:absolute;left:0;top:100%;background:#fff;border:1px solid #ced4da;box-shadow:0 4px 10px rgba(0,0,0,.12);z-index:30}
.mdd .ml button{display:block;border:0;background:none;padding:6px 14px;cursor:pointer;color:#333}
.mdd .ml button:hover{background:var(--erp-green);color:#fff}
.ac .xclr{position:absolute;right:6px;top:5px;color:#888;font-size:11px;pointer-events:none}
.ibar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn.out{background:#fff;color:#444;border:1px solid #888}
.ptool{display:flex;justify-content:space-between;align-items:center;border:1px solid #dee2e6;border-bottom:0;padding:5px 10px;font-size:10px;font-weight:600}
.ptool span{display:inline-flex;gap:10px;align-items:center}
.pfoot{display:flex;gap:90px;padding:6px 10px;border:1px solid #dee2e6;border-top:0;font-size:10px;font-weight:600}
.backl{border:0;background:none;color:#6b7780;font-size:10px;text-decoration:underline;cursor:pointer;font-family:inherit}
.grid tr.green td{background:#dcebc7}
.hrow td{background:#f1f3f3}
</style>

  <div class="foot"><button class="btn grey" data-act="mclose">Cancel</button><button class="btn" data-act="msave" data-t="msave"${ok?'':' disabled'}>Save</button></div></div></div>`;
}

<script>
/* ================= ACCIONES ================= */
const FLG={types:['Bill-to'],nombre:'FLORALINK LLC.',dir1:'1234 UNIVERSITY AVE',dir2:'',pais:U,sub:'UTAH',ciudad:'PROVO',zip:'84601',lat:'40.2338',lng:'-111.6585'};
const BLG={types:['Consignee'],nombre:'BLOOMS AND BASKETS',dir1:'3640 W 2100 S',dir2:'',pais:U,sub:'UTAH',ciudad:'SALT LAKE CITY',zip:'84120',lat:'40.7608',lng:'-111.8910'};
const TLG={types:['Consignee'],nombre:'TSTEMCONG',dir1:'INTERNATIONAL DR',dir2:'',pais:U,sub:'FLORIDA',ciudad:'ORLANDO',zip:'36636',lat:'28.4624091',lng:'-81.4603345'};
const CLG={tipo:'CLIENTS',pais:U,tid:'OTHER',nombre:'FLL / FLOWER TEST',estatus:'ACTIVE',sub:'UTAH',ciudad:'PROVO',idn:'9999999',alias:'FLL / FLOWER TEST',dir:'1111 X 111 X',tel:'2222222222',fax:'',zip:'84601',email:'logistics@floralink.com',cel:'',ejec:EMP[0],serv:EMP[1]};

function navGo(a){
  if(a==='cli'){go('cli');S.cli.view='list';S.cli.tab='List';S.ev.cli=1}
  else if(a==='dos'){go('dos');S.ev.dDos=1}
  else if(a==='rec'){go('rec');S.rec.view='inicio';S.rec.guia='';GF.recg={};GP.recg=1;S.rec.vmenu=false;S.navRec=false;S.ev.dRec=1}
  else{go('ent');const t=a==='bill'?'Bill-to':'Consignee';S.ent={...S.ent,tipo:t,applied:{tipo:t,nombre:''},nombre:'',view:'list',modal:null};GF.entlist={};GP.entlist=1;if(a==='bill')S.ev.bill=1;else S.ev.cons=1}
  render();
}
function doLupa(){
  const E=S.ent;E.applied={tipo:E.tipo,nombre:E.nombre.trim()};GP.entlist=1;
  if(E.tipo==='Consignee')S.ev.lupaCons=1;else if(S.ev.lupaCons)S.ev.lupaBill=1;
  if(/floralink/i.test(E.applied.nombre))S.ev.searchFl=1;
  if(E.tipo==='Consignee'&&/red mount/i.test(E.applied.nombre))S.ev.dRedSearch=1;
  render();
}
function genSave(path){
  const F=getP(path),ok=need(null,path,['types','nombre','dir1','pais','ciudad','zip']);
  let good=ok;
  if(F.dir1&&F.dir1.trim().length<10){S.err[path+'.dir1']='Enter 10 characters minimum';good=false}
  ['lat','lng'].forEach(k=>{const v=String(F[k]).trim();if(!v||+v===0||isNaN(+v)){S.err[path+'.'+k]=true;good=false}});
  if(!good){render();return}
  const E=S.ent;
  if(path==='ent.newF'){
    const ent=newEntity(F);S.ents.push(ent);S.curE=ent;
    Object.assign(E,{view:'detail',tab:'Panel',panel:ent.types.includes('Bill-to')?'Bill-to':'Consignee',sec:'General'});
    S.err={};render();toast('Data Created Successfully.');
  }else{S.curE.name=S.curE.general.nombre.trim().toUpperCase();render();toast('Data Updated Successfully.')}
}
function billSave(){
  const e=S.curE;if(!need(null,'curE.bill',['tid','idn','ejec','serv'])){render();return}
  e.bill.mod=nowStr();e.done.general=1;S.err={};render();toast('Data Created Successfully.');
}
function finSave(){S.curE.done.fin=1;render();toast('Data Created Successfully.')}
function consSave(){const c=S.curE.cons;c.mod=nowStr();S.curE.done.cgen=1;render();toast('Data Created Successfully.')}
function rowSave(){
  const E=S.edit,e=S.curE;if(!E)return;
  if(E.kind==='contactos'){
    if(!need(null,'edit',['email','nombre','tel','idioma','notif'])){render();return}
    e.contactos.push({_id:'t'+(SEQ++),email:E.email,nombre:E.nombre,tel:E.tel,idioma:E.idioma,notif:[...E.notif],mod:nowStr()});S.edit=null;S.err={};render();toast('Data Created Successfully.');
  }else if(E.kind==='usuarios'||E.kind==='cusuarios'){
    if(!need(null,'edit',['nombre','usuario','email','rol','idioma'])){render();return}
    (E.kind==='usuarios'?e.usuarios:e.cons.usuarios).push({_id:'u'+(SEQ++),nombre:E.nombre,usuario:E.usuario,email:E.email,rol:E.rol,idioma:E.idioma,estatus:E.estatus||'ACTIVE',mod:nowStr()});S.edit=null;S.err={};render();toast('Data Created Successfully.');
  }else if(E.kind==='consig'){
    let ok=true;
    if(!E.tipo){S.err['edit.tipo']=true;ok=false}
    if(!E.consig){S.err['edit.consig']=E.cq?'Select a consignee from the list':true;ok=false}
    else if(e.consig.some(c=>c.consig===E.consig)){S.err['edit.consig']='This consignee is already related';ok=false}
    if(!ok){render();return}
    S.ent.modal={mode:null,sel:null};GF.refgrid={};GP.refgrid=1;render();
  }else if(E.kind==='param'){S.edit=null;render();toast('Data Updated Successfully.')}
}
function mSave(){
  const M=S.ent.modal,E=S.edit,e=S.curE;if(!M||!E)return;
  let alias,cs;
  if(M.mode==='ref'){const c=CLI_REF.find(x=>x.id===M.sel);if(!c)return;alias=c.nombre;cs=[{c:c.id,s:'UNIFICADO'}]}
  else if(M.mode==='new'){
    const code=nextCode();alias='FLL / '+E.consig;cs=[{c:code,s:'UNIFICADO'}];
    const g=(entByName(E.consig,'Consignee')||{}).general||{};
    S.clients.push({...C(alias,g.dir1||M0,(g.ciudad||'PROVO'),(g.sub||'UTAH'),(g.pais||U)),_id:'c'+(SEQ++),gen:1});S.ev.newClient=code;
  }else return;
  e.consig.push({_id:'k'+(SEQ++),tipo:E.tipo,consig:E.consig,alias,codes:cs,estatus:E.estatus||'ACTIVE',mod:nowStr()});
  const ce=entByName(E.consig,'Consignee');if(ce)ce.cons.related.push({name:e.name,tipo:E.tipo,alias,ent:'Bill-to'});
  e.done.consig=1;S.ent.modal=null;S.edit=null;S.err={};render();toast('Data Created Successfully.');
}
const M0='1111 X 111 X';
function cliSave(path){
  if(path!=='cli.newF'){toast('Data Updated Successfully.');return}
  const keys=['pais','tid','nombre','estatus','sub','ciudad','idn','alias','dir','tel','zip','email','ejec','serv'];
  if(!need(null,path,keys)){render();return}
  const F=S.cli.newF,id='c'+(SEQ++);
  S.clients.push({...C(F.nombre.trim().toUpperCase(),F.dir,F.ciudad,F.sub,F.pais,F.estatus),_id:id,form:{...F,nombre:F.nombre.trim().toUpperCase()},gen:0});
  S.cli.sel=id;S.cli.view='list';S.cli.tab='List';S.ev.cliCreated=F.nombre.trim().toUpperCase();S.err={};S.cli.newF=blankCli();
  render();toast('Data Created Successfully.');
}
function act(a,el){
  const d=el.dataset,E=S.ent;
  switch(a){
  case 'hamb':S.navOpen=!S.navOpen;if(S.navOpen)S.ev.menu=1;render();break;
  case 'navcat':S.navCat=!S.navCat;render();break;
  case 'navent':S.navEnt=!S.navEnt;render();break;
  case 'navnoop':toast('This menu option is not included in the prototype');break;
  case 'navgo':navGo(d.a);break;
  case 'noop':toast(d.m||'Not included in the prototype');break;
  default:act2(a,el);
  case 'lupa':doLupa();break;
  case 'ent-plus':E.view='new';E.newF=blankGeneral();S.err={};S.ev.plus=1;render();break;
  case 'ent-open':{
    if(d.id.startsWith('b:')){toast('This record is not included in the prototype. Open one created in the practice.');break}
    const ent=S.ents.find(x=>x.id===d.id);if(!ent)break;
    if(ent.name==='FLORALINK LLC.'&&entByName('BLOOMS AND BASKETS','Consignee'))S.ev.reopenFl=1;
    if(ent.name===RED_NAME)S.ev.dRedEnt=1;
    S.curE=ent;S.edit=null;S.err={};Object.assign(E,{view:'detail',tab:'Panel',panel:E.applied.tipo==='Consignee'&&ent.types.includes('Consignee')?'Consignee':ent.types.includes('Bill-to')?'Bill-to':'Consignee',sec:'General'});render();break;}
  case 'etab':
    S.edit=null;S.err={};S.msOpen=null;
    if(d.a==='List'){E.view='list';E.tipo=E.applied.tipo}
    else if(d.a==='General')E.tab='General';
    else{E.tab='Panel';E.panel=d.a;E.sec='General'}
    render();break;
  case 'sec':E.sec=d.a;S.edit=null;S.err={};if(d.a==='Parameters'){if(E.panel==='Bill-to')S.curE.done.par=1;else S.curE.done.cpar=1}render();break;
  case 'gen-save':genSave(d.a);break;
  case 'bill-save':billSave();break;
  case 'fin-save':finSave();break;
  case 'cons-save':consSave();break;
  case 'add-row':{
    const k=d.a;
    if(k==='contactos')S.edit={kind:k,email:'',nombre:'',tel:'',idioma:'',notif:[...NOTIF]};
    else if(k==='consig'){S.edit={kind:k,tipo:'',consig:'',cq:'',alias:'',estatus:'ACTIVE'};S.ev.addConsig=1}
    else S.edit={kind:k,nombre:'',usuario:'',email:'',rol:'',idioma:'',estatus:'ACTIVE'};
    S.err={};render();break;}
  case 'row-cancel':S.edit=null;S.err={};E.modal=null;render();break;
  case 'par-edit':S.edit={kind:'param',idx:+d.id,valor:''};render();break;
  case 'row-save':rowSave();break;
  case 'row-del':{
    const e=S.curE,k=d.a;
    if(k==='contactos')e.contactos=e.contactos.filter(x=>x._id!==d.id);
    else if(k==='usuarios')e.usuarios=e.usuarios.filter(x=>x._id!==d.id);
    else if(k==='cusuarios')e.cons.usuarios=e.cons.usuarios.filter(x=>x._id!==d.id);
    else if(k==='consig'){const r=e.consig.find(x=>x._id===d.id);e.consig=e.consig.filter(x=>x._id!==d.id);const ce=r&&entByName(r.consig,'Consignee');if(ce)ce.cons.related=ce.cons.related.filter(x=>x.name!==e.name)}
    render();toast('Data Deleted Successfully.');break;}
  case 'ms-toggle':S.msOpen=S.msOpen===d.a?null:d.a;render();break;
  case 'ms-pick':{const arr=getP(d.a),i=arr.indexOf(d.v);if(i<0)arr.push(d.v);else arr.splice(i,1);delete S.err[d.a];render();break;}
  case 'ms-clear':setP(d.a,[]);S.msOpen=null;render();break;
  case 'mclose':E.modal=null;render();break;
  case 'ref-sel':E.modal.sel=d.id;render();break;
  case 'msave':mSave();break;
  case 'cli-new':S.cli.view='new';S.cli.newF=blankCli();S.err={};render();break;
  case 'crow':S.cli.sel=d.id;if(selCli().nombre===BLOOMS_NAME)S.ev.blSel=1;if(selCli().nombre===RED_CLI)S.ev.redCli=1;render();break;
  case 'ctab':{
    const c=S.cli;
    if(c.view==='new'){if(d.a==='List'){c.view='list';c.tab='List';S.err={};render()}else toast('Save the client to enable the other tabs');break}
    if(d.a!=='List'&&!c.sel){toast('Select a client in the List tab');break}
    c.tab=d.a;if(d.a!=='List')S.ev.tabs[d.a]=1;if(d.a==='Carrier'&&selCli()&&selCli().nombre===RED_CLI)S.ev.dRedTrans=1;render();break;}
  case 'cli-save':cliSave(d.a);break;
  case 'mopen':S.mopen=S.mopen===d.a?null:d.a;updateManual();break;
  case 'mfill':fillStep(d.a);break;
  case 'mok':S.ev['ok_'+d.a]=1;updateManual();break;
  case 'reset':init(S.track);render();break;
  }
}
function showAc(inp){
  const list=inp.nextElementSibling;if(!list)return;const q=inp.value.toLowerCase();
  const m=allConsigNames().filter(n=>n.toLowerCase().includes(q)).slice(0,40);
  list.innerHTML=m.map(n=>`<div data-acpick="${esc(n)}">${esc(n)}</div>`).join('');list.hidden=!m.length;
  const r=inp.getBoundingClientRect();list.style.position='fixed';list.style.left=r.left+'px';list.style.right='auto';list.style.width=Math.max(r.width,260)+'px';list.style.top=r.bottom+'px';list.style.maxHeight=Math.max(120,Math.min(240,innerHeight-r.bottom-10))+'px';
}
document.addEventListener('scroll',()=>$$('.aclist').forEach(l=>l.hidden=true),true);
document.addEventListener('click',e=>{
  const t=e.target;
  const tr=t.closest('[data-track]');if(tr){setTrack(tr.dataset.track);return}
  const gp=t.closest('[data-gp]');if(gp){const[id,v]=gp.dataset.gp.split('|');gridPage(id,v);return}
  const pk=t.closest('[data-acpick]');
  if(pk){const inp=pk.closest('.ac').querySelector('input');S.edit.consig=pk.dataset.acpick;S.edit.cq=S.edit.consig;inp.value=S.edit.consig;pk.parentElement.hidden=true;delete S.err['edit.consig'];updateManual();return}
  if(!t.closest('.ac'))$$('.aclist').forEach(l=>l.hidden=true);
  const el=t.closest('[data-act]');
  if(S.msOpen&&!t.closest('.ms')){S.msOpen=null;if(!el||el.dataset.act.startsWith('ms-')===false){/* se cierra al re-renderizar */}if(!el){render();return}}
  if(el)act(el.dataset.act,el);
});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.ac)showAc(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f_ent_nombre'){e.preventDefault();S.ent.nombre=e.target.value;doLupa()}});
function onBind(p){
  if(/\.pais$/.test(p)){setP(p.replace(/pais$/,'sub'),'');setP(p.replace(/pais$/,'ciudad'),'')}
  if(/\.sub$/.test(p))setP(p.replace(/sub$/,'ciudad'),'');
  if(p==='edit.tipo'){S.edit.cq='';S.edit.consig='';S.edit.alias=''}
}
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.b){
    const p=d.b;let v;
    if(t.type==='radio'){if(!t.checked)return;v=d.v}else if(t.type==='checkbox')v=t.checked;else v=t.value;
    setP(p,v);delete S.err[p];onBind(p);
    if(d.rr){render();const n=document.getElementById(t.id);if(n&&t.tagName==='SELECT')n.focus()}else updateManual();
    return}
  if(d.gf){const[id,k]=d.gf.split('|');(GF[id]=GF[id]||{})[k]=t.value;GP[id]=1;fillGrid(id);
    if(id==='recg'&&k==='guia'){S.rec.guia=t.value;if(t.value.trim()===GUIA)S.ev.dGuia=1}
    if(id==='clilist'&&k==='nombre'){if(/floralink/i.test(t.value))S.ev.cliFl=1;if(/^fll/i.test(t.value.trim()))S.ev.cliFll=1}
    updateManual();return}
  if(d.gs){GP[d.gs+'s']=+t.value;GP[d.gs]=1;fillGrid(d.gs);return}
  if(d.ac){S.edit.cq=t.value;S.edit.consig='';delete S.err['edit.consig'];showAc(t);updateManual()}
});

/* ================= MANUAL ================= */
const vals=rows=>`<table class="vals">${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
const navT=w=>{if(!S.navOpen)return '[data-t=hamb]';if(w==='dos'){return S.navCat?'[data-t=navdos]':'[data-t=navcat]'}if(w==='rec'){return S.navRec?'[data-t=navemb]':'[data-t=navrec]'}if(!S.navCat)return '[data-t=navcat]';if(w==='cli')return '[data-t=navcli]';if(!S.navEnt)return '[data-t=navent]';return w==='bill'?'[data-t=navbill]':'[data-t=navcons]'};
const inFloral=sec=>S.screen==='ent'&&S.ent.view==='detail'&&S.curE&&S.curE===FLORAL()&&S.ent.panel==='Bill-to'&&(!sec||S.ent.sec===sec);
function goFloral(sec){const fl=FLORAL();if(!fl)return false;go('ent');S.curE=fl;Object.assign(S.ent,{view:'detail',tab:'Panel',panel:'Bill-to',sec,modal:null});return true}
function fillNew(g){
  const same=S.screen==='ent'&&S.ent.view==='new';
  if(!same){const t=g.types[0];go('ent');Object.assign(S.ent,{tipo:t,applied:{tipo:t,nombre:''},nombre:'',view:'new',modal:null});GF.entlist={}}
  S.ent.newF={...g,types:[...g.types]};S.err={};render();
}
const newFilled=g=>S.screen==='ent'&&S.ent.view==='new'&&S.ent.newF.nombre===g.nombre;
function fillRel(tipo,name,code){
  const M=S.ent.modal;
  if(M){
    if(!M.mode){M.mode=code?'ref':'new';if(code){GF.refgrid={nombre:name==='BLOOMS AND BASKETS'?'blooms and baskets':''};GP.refgrid=1}render();return}
    if(M.mode==='ref'&&!M.sel){M.sel=code;render();return}
    mSave();return;
  }
  if(S.edit&&S.edit.kind==='consig'&&S.edit.tipo===tipo&&S.edit.consig===name&&inFloral('Consignees')){rowSave();return}
  if(!inFloral('Consignees'))goFloral('Consignees');
  S.ev.addConsig=1;S.edit={kind:'consig',tipo,consig:name,cq:name,alias:'',estatus:'ACTIVE'};S.err={};render();
}
function relTarget(tipo,name,code){
  const M=S.ent.modal;
  if(M){if(!M.mode)return code?'[data-t=mref]':'[data-t=mnew]';if(M.mode==='ref'&&!M.sel)return '[data-t=refrow]';return '[data-t=msave]'}
  if(S.edit&&S.edit.kind==='consig'&&inFloral('Consignees')){if(!S.edit.tipo)return '[id=f_edit_tipo]';if(!S.edit.consig)return '[data-t=acin]';return '[data-t=rowsave]'}
  if(inFloral('Consignees'))return '[data-t=addcons]';
  return null;
}
const hasRel=(name,code)=>{const f=FLORAL();return !!f&&f.consig.some(c=>c.consig===name&&(!code||c.codes.some(x=>x.c===code)))};

function stepsNow(){
  return [
  {ph:'1 · Enter the module',id:'n1',t:'Open the hamburger menu',b:'Click the ☰ icon in the top-left corner.',target:()=>'[data-t=hamb]',done:()=>S.ev.menu,fill:()=>{S.navOpen=true;S.ev.menu=1;render()}},
  {ph:'1 · Enter the module',id:'n2',t:'Catalogs > Entities > Bill-to',b:'Under Catalogs, open <b>Entities</b> and choose <b>Bill-to</b>.',target:()=>navT('bill'),done:()=>S.ev.bill,fill:()=>navGo('bill')},
  {ph:'1 · Enter the module',id:'n3',t:'Switch between Bill-to and Consignee',b:'It is a single module. <b>Type Entity</b> filters the list by type. Choose <b>Consignee</b>, click the magnifier, then go back to <b>Bill-to</b> and click the magnifier again.',target:()=>S.ev.lupaCons?'[data-t=lupa]':'[id=f_ent_tipo]',done:()=>S.ev.lupaBill,

  {ph:'1 · Enter the module',id:'n4',t:'Search for Floralink',b:'Type <code>floralink</code> in <b>Name</b> and click the magnifier. You can also filter inside each column. It does not exist yet: you will create it.',target:()=>'[data-t=lupa]',done:()=>S.ev.searchFl,

  {ph:'2 · Create the Floralink Bill-to',id:'n5',t:'Click + in List',b:'The <b>+</b> button opens the <b>General</b> tab.',target:()=>'[data-t=plus]',done:()=>S.ev.plus||FLORAL(),

    target:()=>'[data-t=gsave]',done:()=>FLORAL(),fill:()=>{newFilled(FLG)?genSave('ent.newF'):fillNew(FLG)}},
  {ph:'2 · Create the Floralink Bill-to',id:'n7',t:'Complete the Bill-to General section',b:'Once saved, the other sections are enabled. Fill in and save:'+vals([['Identification ID','OTHER'],['Identification','9999999'],['Commercial Executive','COMMERCIAL EXECUTIVE (SAMPLE)'],['Customer Service','CUSTOMER SERVICE (SAMPLE)'],['Status','ACTIVE']]),
    target:()=>inFloral('General')?'[data-t=bsave]':'[data-t=tabbill]',done:()=>FLORAL()&&FLORAL().done.general,
    fill:()=>{const e=FLORAL();if(!e)return;if(!inFloral('General'))goFloral('General');if(e.bill.idn==='9999999'&&e.bill.ejec){billSave();return}e.bill={...e.bill,tid:'OTHER',idn:'9999999',ejec:EMP[0],serv:EMP[1]};render()}},

function updateManual(){
  const man=$('#manual');if(!man)return;
  const steps=curSteps();
  const dn=steps.map(s=>{try{return !!s.done()}catch(e){return false}});
  const cur=dn.indexOf(false);const nd=dn.filter(Boolean).length;
  const intro=S.track==='dos'?`<b>Days of Service:</b> they define which days the carrier leaves for each consignee. Exercise: shipment <code>36999300003</code> (waybill ${GUIA}) with ship-to <b>${RED_NAME}</b>, not yet homologated. Floralink is already created and has it related as Ship-to.`:S.track==='now'
   ?`<b>Now:</b> everything lives in Catalogs > Entities. A <b>Bill-to</b> (payer) is related to its <b>consignees</b>, and each relation references an existing client or creates a new Client record. Practical example: Floralink.`
   :`<b>Before:</b> clients were handled in Catalogs > Clients. Customer Service created them with the information from the sales rep and handled any change.`;
  let h=`<div class="intro">${intro}</div><div class="prog"><div class="bar"><i style="width:${Math.round(nd/steps.length*100)}%"></i></div><span>${nd} of ${steps.length}</span></div>`;
  let ph='';
  h+='<ol class="steps">';
  steps.forEach((s,i)=>{
    if(s.ph!==ph){ph=s.ph;h+=`</ol><div class="phase">${esc(ph)}</div><ol class="steps">`}
    const open=i===cur||S.mopen===s.id,cls=dn[i]?'done':(i===cur?'cur':'');
    const body=typeof s.b==='function'?s.b():s.b;
    h+=`<li class="step ${cls}" data-sid="${s.id}"><span class="dot">${dn[i]?'✓':i+1}</span><div><h3 style="cursor:pointer" data-act="mopen" data-a="${s.id}">${esc(s.t)}</h3>${open?`<div class="body">${body}</div>`:''}${open&&!dn[i]?`<div class="acts">${s.fill?`<button class="mbtn pri" data-act="mfill" data-a="${s.id}">Do it for me</button>`:''}${s.manual?`<button class="mbtn pri" data-act="mok" data-a="${s.id}">Got it</button>`:''}</div>`:''}</div></li>`;
  });
  h+='</ol>';
  if(cur===-1)h+=`<div class="final"><b>Practice complete.</b> ${S.track==='dos'?'Red Mountain is now homologated and has days of service: the waybill takes Mon, 26 Oct 2026 with PRI - 14:00 - PRIME INC. You can keep practicing edit, clone and delete.':S.track==='now'?'Floralink is created with its three relations. You can open the Consignee tab of BLOOMS AND BASKETS to see the inverse relation, or switch to <b>Before: Clients</b> to compare.':'You now know how to search and create clients the way it used to be done. Switch to <b>Now: Entities</b> to see the new flow.'}</div>`;
  h+='<button class="reset" data-act="reset">Restart practice</button>';
  const sc=man.scrollTop;man.innerHTML=h;man.scrollTop=sc;
  const curStep=cur>=0?steps[cur]:null;
  if(curStep&&LASTCUR!==curStep.id){LASTCUR=curStep.id;const n=$('.step.cur',man);if(n)n.scrollIntoView({block:'nearest'})}
  $$('.hint').forEach(x=>x.classList.remove('hint'));
  if(curStep&&curStep.target){let sel=null;try{sel=curStep.target()}catch(e){}if(sel){const el=$(sel,$('#erp'));if(el){el.classList.add('hint');if(el.closest('.drawer'))el.scrollIntoView({block:'nearest'})}}}
}

}

    fill:()=>{if(S.screen!=='ent'||S.ent.applied.tipo!=='Consignee')navGo('cons');S.ent.tipo='Consignee';S.ent.nombre='red mountain';doLupa()}},
  {ph:'1 · See how Red Mountain is set up',id:'d2',t:'Open FLL - RED MOUNTAIN WHOLESALE',b:'It is a consignee. In the <b>Consignee</b> tab > General, the <b>Related Bill-to and Groups</b> table shows that Floralink has it as <b>SHIP-TO CONSIGNEE</b>. This is the same name you will see in the homologation.',target:()=>$('[data-t=redent]')?'[data-t=redent]':'[data-t=lupa]',done:()=>S.ev.dRedEnt,
    fill:()=>{if(!$('[data-t=redent]')){navGo('cons');S.ent.tipo='Consignee';S.ent.nombre='red mountain';doLupa()}act('ent-open',{dataset:{id:redEnt().id}})}},
  {ph:'1 · See how Red Mountain is set up',id:'d3',t:'Clients: open FLL / RED MOUNTAIN WHOLESALE',b:'Menu ☰ > Catalogs > <b>Clients</b>. Type <code>red mount</code> in the Name filter and click the <b>FLL / RED MOUNTAIN WHOLESALE</b> row. In the Clients module the name uses <code>/</code> instead of <code> - </code>. Go through General, Contact, Invoicing, Carrier and System Integration (code <code>CLI0416288</code> and UNIFICADO 2693).',
    target:()=>$('[data-t=redcli]')?'[data-t=redcli]':(S.screen==='cli'?'[data-gf="clilist|nombre"]':navT('cli')),done:()=>S.ev.redCli,
    fill:()=>{navGo('cli');GF.clilist={nombre:'red mount'};S.cli.sel=redCliId();S.ev.redCli=1;render()}},
  {ph:'1 · See how Red Mountain is set up',id:'d4',t:'Carrier tab (how it used to be done)',b:'Open <b>Carrier</b>. This is how it used to be handled: <b>Monday and Wednesday</b> with <b>MIA - PRIME INC.</b> and account <b>2599</b>. This is the information that is now defined in <b>Days of Service</b>; nothing is created here in the exercise.',target:()=>S.cli.sel===redCliId()?'[data-act=ctab][data-a="Carrier"]':'[data-t=redcli]',done:()=>S.ev.dRedTrans,
    fill:()=>{if(S.screen!=='cli'||S.cli.sel!==redCliId()){navGo('cli');S.cli.sel=redCliId()}S.cli.view='list';S.cli.tab='Carrier';S.ev.dRedTrans=1;S.ev.tabs['Carrier']=1;render()}},

  {ph:'2 · Locate the shipment',id:'d5',t:'Menu > Receiving > Shipments',b:'Open the ☰ menu and go to <b>Receiving</b> > <b>Shipments</b>. <b>Receiving - Shipment</b> opens with ETA From 13 Oct and ETA Until 28 Oct 2026.',target:()=>navTd('rec'),done:()=>S.ev.dRec,fill:()=>navGo('rec')},
  {ph:'2 · Locate the shipment',id:'d6',t:'Search waybill 369-9930 0003',b:'Type <code>369-9930 0003</code> in the <b>Waybill</b> field and click the magnifier (the Waybill column filter also works). A single row remains: ESTIMATED, MEDELLIN, 507 pieces.',target:()=>R_guiaOk()?null:'[data-t=recguia]',done:()=>S.ev.dGuia,
    fill:()=>{ensureRec();S.rec.guia=GUIA;GF.recg={guia:GUIA};GP.recg=1;S.ev.dGuia=1;render()}},
  {ph:'2 · Locate the shipment',id:'d7',t:'Views > By Ship-to',b:'In the row, click the <b>Views</b> icon (green sheet, Views column) and choose <b>By Ship-to</b>. The detail tab opens.',target:()=>S.rec.vmenu?'[data-t=vcf]':'[data-t=vistas]',done:()=>S.ev.dCf,
    fill:()=>{ensureRec();S.rec.view='cf';S.rec.cfOpened=true;S.rec.vmenu=false;S.ev.dCf=1;render()}},
  {ph:'2 · Locate the shipment',id:'d8',t:'Review: Red Mountain does not appear',b:'There are 22 lines, but <b>FLL - RED MOUNTAIN WHOLESALE</b> is not there. Its pieces are inside the first row (<code>-</code>, 199 pieces without a ship-to) because it is not homologated yet.',manual:true,target:()=>null,done:()=>S.ev.ok_d8},
  {ph:'2 · Locate the shipment',id:'d9',t:'Go back to the Home tab',b:'From the tab stepper (Home > By Ship-to) you can go back and forth. Click <b>Home</b>.',target:()=>'[data-t=stinicio]',done:()=>S.ev.dInicio,fill:()=>{ensureRec();if(S.rec.view==='cf')S.ev.dInicio=1;S.rec.view='inicio';render()}},

  {ph:'3 · Homologate the ship-to',id:'d10',t:'Click the homologation bell',b:'The red bell in the row indicates origin consignees without a homologated code. Click the bell: <b>Consignees without homologated code - 369-9930 0003</b> opens.',target:()=>'[data-t=bell]',done:()=>S.ev.dHomOpen,fill:()=>{ensureRec();if(S.rec.view!=='inicio')S.rec.view='inicio';S.rec.homOpen=true;S.ev.dHomOpen=1;render()}},
  {ph:'3 · Homologate the ship-to',id:'d11',t:'Assign Bill-to and Consignee',b:'Find the row <b>FLL - RED MOUNTAIN WHOLESALE - CLI0416288</b> (scroll down the list). In <b>Bill-to</b> type <code>floralink</code> and choose <b>FLORALINK LLC.</b>; then in <b>Consignee</b> type <code>red</code> and choose <b>T3-FLL - RED MOUNTAIN WHOLESALE</b>.'+vals([['Origin Consignee','FLL - RED MOUNTAIN WHOLESALE - CLI0416288'],['Bill-to','FLORALINK LLC.'],['Consignee','T3-FLL - RED MOUNTAIN WHOLESALE']]),
    target:()=>S.rec.homSel.pag!=='FLORALINK LLC.'?'[data-t=hompag]':'[data-t=homcons]',done:()=>S.rec.hom||(S.rec.homSel.pag==='FLORALINK LLC.'&&S.rec.homSel.cons==='T3-'+RED_NAME),
    fill:()=>{ensureRec();S.rec.homOpen=true;S.rec.homSel={pag:'FLORALINK LLC.',cons:'T3-'+RED_NAME};render();const r=$('[data-t=homred]');if(r)r.scrollIntoView({block:'nearest'})}},
  {ph:'3 · Homologate the ship-to',id:'d12',t:'Save the homologation',b:'Click the disk icon at the bottom of the window.',target:()=>'[data-t=homsave]',done:()=>S.rec.hom,fill:()=>{if(!S.rec.homOpen){S.rec.homOpen=true;S.rec.homSel={pag:'FLORALINK LLC.',cons:'T3-'+RED_NAME}}act('hom-save',{dataset:{}})}},
  {ph:'3 · Homologate the ship-to',id:'d13',t:'Close the homologation window',b:'Close with the × or with the cancel button.',target:()=>'[data-t=homclose]',done:()=>S.rec.hom&&!S.rec.homOpen,fill:()=>{S.rec.homOpen=false;render()}},
  {ph:'3 · Homologate the ship-to',id:'d14',t:'Views > By Ship-to: the new line appears',b:'Repeat Views > By Ship-to. Now there is a <b>FLL - RED MOUNTAIN WHOLESALE</b> line with <b>15 pieces</b>, taken from the 199 without a ship-to (184 remain). Ship Date and Carrier are still empty.',target:()=>S.rec.vmenu?'[data-t=vcf]':'[data-t=vistas]',done:()=>S.ev.dCfAfter,
    fill:()=>{ensureRec();S.rec.view='cf';S.rec.cfOpened=true;S.rec.vmenu=false;S.ev.dCf=1;if(S.rec.hom)S.ev.dCfAfter=1;render()}},
  {ph:'3 · Homologate the ship-to',id:'d15',t:'Click the 15 to see the barcodes',b:'Click the number of pieces in the Red Mountain row. The screen with the 15 barcodes opens.',target:()=>'[data-t=redpa]',done:()=>S.ev.dBar,fill:()=>{ensureRec();act('rec-bar',{dataset:{}})}},
  {ph:'3 · Homologate the ship-to',id:'d16',t:'Close to resume the exercise',b:'Click <b>Close</b> (in the real system you just go back). Carrier and Ship Date appear empty because there are no days of service yet.',target:()=>'[data-t=barclose]',done:()=>S.ev.dBarClose,fill:()=>act('rec-barclose',{dataset:{}})},
  {ph:'3 · Homologate the ship-to',id:'d17',t:'Home > the waybill truck',b:'Go back to <b>Home</b> and click the truck icon in the waybill row. <b>Customer Scheduling</b> opens.',target:()=>S.rec.view==='inicio'&&S.screen==='rec'?'[data-t=truck]':'[data-t=stinicio]',done:()=>S.ev.dProg,
    fill:()=>{ensureRec();if(S.rec.view!=='inicio')S.rec.view='inicio';if(!GF.recg||!GF.recg.guia){S.rec.guia=GUIA;GF.recg={guia:GUIA}}render();act('rec-truck',{dataset:{}})}},
  {ph:'3 · Homologate the ship-to',id:'d18',t:'Review the Red Mountain line',b:'<b>FLL - RED MOUNTAIN WHOLESALE</b> is there with 15 pieces, but <b>Ship Date</b> and <b>Carrier</b> are empty: it is not created in Days of Service yet. Top right: <b>Scheduled: 16 / 23</b>.',manual:true,target:()=>null,done:()=>S.ev.ok_d18},

  {ph:'4 · Create the days of service',id:'d19',t:'Menu > Catalogs > Days of Service',b:'Menu ☰ > Catalogs > <b>Days of Service</b>. At the top is the search header (hide it with the arrow); below, the list with the days of each week and the detail on the right.',target:()=>navTd('dos'),done:()=>S.ev.dDos,fill:()=>navGo('dos')},
  {ph:'4 · Create the days of service',id:'d20',t:'Search the consignee',b:'In <b>Consignee</b> type <code>red mountain</code>, choose the option and click the magnifier. There are no records: it does not have days of service yet.',target:()=>/red mountain/i.test(S.dos.hf.cons)?'[data-t=dossearch]':'[data-t=hfcons]',done:()=>S.ev.dSearchRed,
    fill:()=>{if(S.screen!=='dos')navGo('dos');S.dos.panel=true;S.dos.hf.cons=RED_NAME;S.dos.ap={...S.dos.hf};S.dos.page=1;S.ev.dSearchRed=1;render()}},
  {ph:'4 · Create the days of service',id:'d21',t:'Click + to create',b:'The <b>+</b> adds a new row at the top of the list. The detail panel on the right is enabled.',target:()=>'[data-t=dosplus]',done:()=>S.ev.dNew,fill:()=>{if(S.screen!=='dos')navGo('dos');act('dos-new',{dataset:{}})}},
  {ph:'4 · Create the days of service',id:'d22',t:'Standard: no Bill-to',b:'Mode and consignee are chosen in the row (Bill-to is optional and brings the Bill-tos related to the consignee); origin and destination are searched in terminals. In the detail mark the days and save.'+vals([['Mode','Truck'],['Consignee','FLL - RED MOUNTAIN WHOLESALE'],['Bill-to','(empty)'],['Origin','WH-MIA - Warehouse MIA'],['Destination','PIK - PICK-UP'],['Frequency','Sunday, Tuesday, Thursday, Friday, Saturday'],['Start Day','Sun, 25 Oct 2026 · every 1 week']]),
    target:()=>S.dos.draft?'[data-t=dossave]':'[data-t=dosplus]',done:()=>stdRow(),fill:()=>fillCreate(STD)},
  {ph:'4 · Create the days of service',id:'d23',t:'Specific: with Bill-to Floralink',b:'Click + again. When you choose the consignee, Bill-to is enabled and <b>FLORALINK LLC.</b> appears, because it is related in Entities.'+vals([['Mode','Truck'],['Consignee','FLL - RED MOUNTAIN WHOLESALE'],['Bill-to','FLORALINK LLC.'],['Origin','WH-MIA - Warehouse MIA'],['Destination','MIA - PRIME INC.'],['Account Nr.','2599'],['Frequency','Monday, Wednesday'],['Start Day','Sun, 25 Oct 2026 · every 1 week']]),
    target:()=>S.dos.draft?'[data-t=dossave]':'[data-t=dosplus]',done:()=>spcRow(),fill:()=>fillCreate(SPC)},
  {ph:'4 · Create the days of service',id:'d24',t:'Move to the week of October 26',b:'The list shows the week of 19 to 25. With the <b>›</b> arrow in the days header you go to the next week: there you see the Monday and Wednesday of the specific one and the whole standard.',target:()=>'[data-t=weeknext]',done:()=>S.ev.dWeek,fill:()=>{if(S.screen!=='dos')navGo('dos');act('dos-week',{dataset:{a:'1'}})}},

  {ph:'5 · Verify in Scheduling',id:'d25',t:'Go back to Scheduling and refresh',b:'Menu ☰ > Receiving > Shipments, filter the waybill, click the truck and, in Customer Scheduling, click <b>refresh</b> (top right). The Red Mountain row takes <b>Mon, 26 Oct 2026</b> and <b>PRI - 14:00 - PRIME INC.</b>: the specific Bill-to day takes priority over the standard one.',
    target:()=>S.screen==='prog'?'[data-t=progref]':(S.screen==='rec'&&S.rec.view==='inicio'&&GF.recg&&GF.recg.guia?'[data-t=truck]':(S.screen==='rec'?'[data-t=recguia]':navTd('rec'))),done:()=>S.ev.dRefresh,
    fill:()=>{if(S.screen==='prog'){act('prog-refresh',{dataset:{}});return}if(S.screen!=='rec'){navGo('rec');S.rec.guia=GUIA;GF.recg={guia:GUIA};render();return}S.rec.view='inicio';if(!GF.recg||!GF.recg.guia){S.rec.guia=GUIA;GF.recg={guia:GUIA}}render();act('rec-truck',{dataset:{}})}},
  {ph:'5 · Verify in Scheduling',id:'d26',t:'Review the result',b:'<b>Ship Date: Mon, 26 Oct 2026</b> and <b>Carrier: PRI - 14:00 - PRIME INC.</b>, and the counter becomes <b>Scheduled: 17 / 23</b>. If you go to Receiving > By Ship-to and to the barcodes, you will also see carrier PRI and the date. It is the same result that used to be configured in Clients > Carrier (Monday and Wednesday with MIA - PRIME INC., account 2599), now derived from Days of Service.',manual:true,target:()=>null,done:()=>S.ev.ok_d26},

  {ph:'6 · Practice (optional)',id:'d27',t:'Edit a day of service',b:'Remove the filters, select a row with its checkbox and click the pencil. <b>When editing, only the right-hand panel changes</b> (commodity, account, frequency, start); mode, consignee, Bill-to, origin and destination stay locked. Change the Account Nr. and save.',
    target:()=>S.dos.draft&&S.dos.mode==='edit'?'[data-t=dossave]':(S.dos.sel?'[data-t=dosedit]':'[data-t=dosrow]'),done:()=>S.ev.dEdit,
    fill:()=>{if(S.screen!=='dos')navGo('dos');const D=S.dos;if(!D.draft||D.mode!=='edit'){pickSample();D.mode='edit';D.draft=clone(selRow());D.draft.cuenta='3150';render();return}dosSave()}},
  {ph:'6 · Practice (optional)',id:'d28',t:'Clone a day of service',b:'Select a row and click the clone icon: a new row appears at the top with the copied information and <b>everything is editable</b> (right and left). Change the destination to <b>SVN - STAR VAN SYSTEMS INC.</b> and save.',
    target:()=>S.dos.draft&&S.dos.mode==='clone'?'[data-t=dossave]':(S.dos.sel?'[data-t=dosclone]':'[data-t=dosrow]'),done:()=>S.ev.dClone,
    fill:()=>{if(S.screen!=='dos')navGo('dos');const D=S.dos;if(!D.draft||D.mode!=='clone'){if(!D.sel||!selRow())pickSample();const r=selRow();D.mode='clone';D.draft={...clone(r),id:'dn'+(SEQ++),mod:'',destino:'SVN - STAR VAN SYSTEMS INC.'};D.sel=null;render();return}dosSave()}},
  {ph:'6 · Practice (optional)',id:'d29',t:'Delete the clone',b:'Select the cloned row and click the delete icon; confirm with <b>OK</b>.',target:()=>S.dos.confirm?'[data-t=dosdelok]':(S.dos.sel&&S.dos.sel===S.dos.cloneId?'[data-t=dosdel]':'[data-t=dosrow]'),done:()=>S.ev.dDel,
    fill:()=>{if(S.screen!=='dos')navGo('dos');const D=S.dos;if(!D.confirm){D.hf={bill:'',cons:'',modo:'',fecha:'',origen:'',dest:'',merc:''};D.ap={...D.hf};D.cf={modo:'',cons:'',bill:'',origen:'',dest:''};D.page=1;D.sel=D.cloneId||D.rows[0].id;D.confirm=true;render();return}act('dos-del-ok',{dataset:{}})}}
  ];
}
const R_guiaOk=()=>S.rec&&GF.recg&&GF.recg.guia&&GF.recg.guia.trim()===GUIA;
const curSteps=()=>S.track==='now'?stepsNow():S.track==='dos'?stepsDos():stepsBefore();
init('now');render();
</script>
